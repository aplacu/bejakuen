name: Format codebase

on:
  push:
    branches:
      - chore/format-codebase

permissions:
  contents: write

concurrency:
  group: format-codebase-{{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@v4
        with:
          ref: chore/format-codebase
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format tracked source and documentation
        run: |
          git ls-files -z -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' | xargs -0 -r bunx prettier --write
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "All tracked files are already formatted."
            exit 0
          fi
          git add -u
          git commit -m "style: format repository with Prettier"
          git push origin HEAD:chore/format-codebase
